server {
    listen 80;
    server_name globeeconomist.com www.globeeconomist.com;

    root /home/ubuntu/projects/globeeconomist/dist;
    index index.html;

    access_log /var/log/nginx/globeeconomist.access.log;
    error_log /var/log/nginx/globeeconomist.error.log;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=25920000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
